name: Deploy to AWS Elastic Beanstalk

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Verify Build Artifact Exists
        run: |
          echo "=== Listing target/ contents ==="
          ls -la target/*.jar

      - name: Get Timestamp for Versioning
        id: tm
        run: echo "timestamp=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

      - name: Deploy to AWS Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: 'phoenix-middleware'
          environment_name: 'Phoenix-middleware-env'
          version_label: 'deploy-${{ steps.tm.outputs.timestamp }}'
          region: 'us-east-1'
          deployment_package: 'target/application.jar'
